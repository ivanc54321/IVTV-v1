<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002d62"/>
      <stop offset="100%" stop-color="#001226"/>
    </linearGradient>
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="348" height="128" rx="22" fill="url(#bgGrad)" stroke="#1e3a8a" stroke-width="2" filter="url(#glow)"/>
  <!-- Speech Tail -->
  <path d="M 65 110 L 48 132 L 85 110 Z" fill="#001833" />
  
  <!-- "Talk" text -->
  <text x="32" y="90" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-2">talk</text>
  
  <!-- "TV" Red Badge -->
  <rect x="225" y="36" width="98" height="66" rx="14" fill="url(#tvGrad)" filter="url(#glow)"/>
  <text x="274" y="84" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="1">TV</text>
</svg>